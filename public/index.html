<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Runbook</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .hero { text-align: center; padding: 28px 0 8px; }
    .hero h2 { font-size: 26px; margin: 0 0 4px; }
    .hero p { color: var(--muted); margin: 0 0 20px; }
    .hero input { font-size: 17px; padding: 14px 18px; border-radius: 12px; max-width: 620px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 16px 0 24px; }
    .chip { border-radius: 99px; padding: 4px 14px; }
    .chip.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .rb { padding: 16px; text-decoration: none; color: inherit; display: block; }
    .rb:hover { border-color: var(--accent); }
    .rb h3 { margin: 6px 0 4px; font-size: 16px; }
    .rb p { margin: 0; color: var(--muted); font-size: 14px; }
    .rb .meta { margin-top: 8px; font-size: 12px; color: var(--muted); }

    .detail { max-width: 760px; margin: 0 auto; }
    .detail .card { padding: 24px; }
    .detail h2 { margin: 8px 0 4px; font-size: 22px; }
    .symptom { color: var(--muted); margin: 0 0 20px; }
    ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: s; }
    ol.steps li { counter-increment: s; display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--border); cursor: pointer; }
    ol.steps li::before { content: counter(s); flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
    ol.steps li.done { color: var(--muted); text-decoration: line-through; }
    ol.steps li.done::before { content: '✓'; background: var(--ok-bg); color: var(--ok); }
    .outcome { margin-top: 24px; padding: 16px; border-radius: var(--radius); background: var(--surface-2); }
    .outcome h3 { margin: 0 0 10px; font-size: 16px; }
    .outcome .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .escalate { margin-top: 12px; padding: 12px 14px; border-left: 3px solid var(--warn); background: var(--warn-bg); border-radius: 0 8px 8px 0; }

    .admin-only { display: none !important; }
    body.admin .admin-only { display: revert !important; }
    body.admin .admin-only.flex { display: flex !important; }
    .stats-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
    footer { text-align: center; padding: 24px 0 40px; color: var(--muted); font-size: 13px; }
    footer button { font-size: 12px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1><a href="#" style="color:inherit;text-decoration:none">🛠️ <span id="org">IT Helpdesk</span></a> <small>แก้ปัญหาด้วยตัวเองใน 2 นาที</small></h1>
      <button class="primary admin-only" id="btnNew">＋ เขียน runbook</button>
      <a class="btn" id="ticketTop" target="_blank" rel="noopener" hidden>📨 เปิด ticket</a>
    </div>
  </header>

  <main class="wrap" id="view"></main>

  <footer>
    <span id="contact"></span>
    <div style="margin-top:8px"><button id="btnAdmin">⚙ โหมดแอดมิน</button></div>
  </footer>

  <dialog id="dlg">
    <form method="dialog" id="form">
      <h2 id="dlgTitle">เขียน runbook</h2>
      <input type="hidden" name="id">
      <label>หัวข้อ (เขียนแบบที่ user พูด)<input name="title" required placeholder="เช่น ปริ้นท์ไม่ออก"></label>
      <div class="grid2">
        <label>หมวด<input name="category" list="cats" placeholder="เช่น เครื่องพิมพ์"><datalist id="cats"></datalist></label>
        <label>คำค้นเพิ่มเติม (คั่นด้วย ,)<input name="tags" placeholder="printer, ปริ้น, พิมพ์"></label>
      </div>
      <label>อาการ<textarea name="symptoms" rows="2" style="min-height:60px"></textarea></label>
      <label>ขั้นตอน (บรรทัดละ 1 ขั้น)<textarea name="steps" required rows="8"></textarea></label>
      <label>ถ้ายังไม่หาย ให้ทำอะไร / ต้องแนบอะไรมากับ ticket<textarea name="escalate" rows="2" style="min-height:60px"></textarea></label>
      <div class="actions">
        <button value="cancel" formnovalidate>ยกเลิก</button>
        <button class="primary" value="save">บันทึก</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
